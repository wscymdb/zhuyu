server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. 开启 Gzip 深度压缩 (对于 3D 贴图与庞大 JS Bundle 首屏提速至关重要)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm;

    # 2. SPA 路由支持（防止用户刷新页面 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. 带有 Hash 的静态脚本与样式 (永久强缓存 1 年)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. 3D 材质贴图与音频资源 (长期强缓存 30 天)
    location ~* \.(?:jpg|jpeg|png|webp|svg|mp3|ogg|wav|bin|gltf|glb)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 5. 入口文件 index.html 绝不缓存 (保证代码更新后用户刷新立即拉取最新版)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 6. 安全与跨域响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 错误页重定向
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
