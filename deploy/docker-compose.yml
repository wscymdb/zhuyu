services:
  web:
    image: ${APP_NAME:-zhuyu-zen}:${IMAGE_TAG:-latest}
    container_name: ${APP_NAME:-zhuyu-zen}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
